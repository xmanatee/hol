events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml
        model/gltf+json;

    server {
        listen 80;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Permissions-Policy "camera=(self), microphone=(self)" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' https: wss: data:; worker-src 'self' blob:; manifest-src 'self'; base-uri 'self'; frame-ancestors 'self';" always;

        location / {
            try_files $uri $uri/ /index.html;
        }

        location /assets/ {
            expires 1y;
            try_files $uri =404;
        }

        location ~* \.wasm$ {
            default_type application/wasm;
            expires 1h;
            try_files $uri =404;
        }

        location ~* \.mjs$ {
            default_type application/javascript;
            expires 1h;
            try_files $uri =404;
        }

        location ~* \.onnx$ {
            default_type application/octet-stream;
            expires 1h;
            try_files $uri =404;
        }

        location ~* \.gltf$ {
            default_type model/gltf+json;
            expires 1h;
            try_files $uri =404;
        }

        location ~* \.bin$ {
            default_type application/octet-stream;
            expires 1h;
            try_files $uri =404;
        }
    }
}
