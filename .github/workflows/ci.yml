name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify release and deterministic vision contracts
        run: npm run verify:release

      - name: Install mobile browser runtimes
        run: npx playwright install --with-deps chromium webkit

      - name: Test production mobile runtime
        run: npm run test:browser

      - name: Upload production artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hol-dist
          path: |
            dist/
            nginx.conf
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
            artifacts/sbom.cdx.json
          retention-days: 30

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: hol-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: release-gates
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: write
    uses: xmanatee/workflows/.github/workflows/publish-static.yml@main
    with:
      artifact: hol-dist
      dist: dist
      image: hol
