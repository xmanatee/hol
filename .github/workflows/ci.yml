name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Verify release and deterministic vision contracts
        run: npm run verify:release

      - name: Install mobile browser runtimes
        run: npx playwright install --with-deps chromium webkit

      - name: Test production mobile runtime
        run: npm run test:browser

      - name: Upload production artifact
        uses: actions/upload-artifact@v4
        with:
          name: hol-dist
          path: |
            dist/
            nginx.conf
            LICENSE
            NOTICE
            THIRD_PARTY_NOTICES.md
            artifacts/sbom.cdx.json
          retention-days: 30

      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hol-browser-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  dispatch-deploy:
    needs: release-gates
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger deploy on servers repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT_TOKEN }}
          repository: xmanatee/servers
          event-type: deploy-hol
